name: Render site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: install.packages(c("knitr", "rmarkdown", "shiny"))
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Push _site contents to render
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: render
          clean: true
